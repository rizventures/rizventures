<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>RIZ DOCUMENT SYNC FINAL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<style>
body{font-family:Arial;padding:20px;background:#f5f5f5}
.box{background:white;padding:20px;border-radius:12px;max-width:600px}
button{padding:10px 15px;font-weight:bold}
input,select{width:100%;margin-bottom:10px;padding:8px}
</style>
</head>
<body>

<div class="box">
<h2>Add Document (SYNC)</h2>

<input id="title" placeholder="Document title">
<input id="type" placeholder="Type">
<select id="status">
<option>Active</option>
<option>Inactive</option>
</select>
<input id="note" placeholder="Note / link">
<input id="file" type="file">

<button onclick="addDocument()">Upload Document</button>

<hr>

<h3>Documents</h3>
<div id="list"></div>

</div>

<script>
const supabase = window.supabase.createClient(
"https://jtgiswzolnretpezfxpc.supabase.co",
"sb_publishable_9m30QqCS2ttu9td6F84ogQ_JizwPY3v"
);

async function addDocument(){

const file = document.getElementById("file").files[0];
if(!file){alert("select file");return;}

const fileName = Date.now()+"-"+file.name;

// upload
const {error:uploadError} = await supabase.storage
.from("documents")
.upload(fileName,file);

if(uploadError){
alert(uploadError.message);
return;
}

// get url
const {data} = supabase.storage.from("documents").getPublicUrl(fileName);

// save db
const {error} = await supabase.from("documents").insert({
name:document.getElementById("title").value,
type:document.getElementById("type").value,
status:document.getElementById("status").value,
note:document.getElementById("note").value,
file_url:data.publicUrl
});

if(error){
alert(error.message);
return;
}

alert("Uploaded");
loadDocs();
}

async function loadDocs(){
const {data} = await supabase.from("documents").select("*").order("created_at",{ascending:false});

document.getElementById("list").innerHTML = data.map(d=>`
<div style="background:#eee;padding:10px;margin-bottom:8px">
<b>${d.name||"No name"}</b><br>
<a href="${d.file_url}" target="_blank">Open</a>
</div>
`).join("");
}

loadDocs();
</script>

</body>
</html>
